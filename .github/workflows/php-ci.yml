name: PHP CI Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, fileinfo, openssl, pdo_sqlite

      - name: Copy .env file
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Ensure SQLite database exists
        run: touch database/database.sqlite

      - name: Lint code with Pint
        run: ./vendor/bin/pint --test

      - name: Run Application Tests
        run: php artisan test

      - name: Demonstrate GitHub Secrets
        env:
          SECRET_KEY: ${{ secrets.MY_SUPER_SECRET_KEY }}
        run: echo "Secret is $SECRET_KEY"